[package]
name = "flexnet-gx-blockchain"
version = "0.1.0"
edition = "2021"

[dependencies]
solana-program = "~1.16.15"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
borsh = "0.10.3"
borsh-derive = "0.10.3"
spl-token = { version = "3.5.0", features = ["no-entrypoint"] }
blake3 = "1.3"
sha2 = "0.10"
aes-gcm = "0.10"
hex = "0.4"
rand = { version = "0.8", features = ["std"] }
spl-associated-token-account = { version = "1.1.3", features = ["no-entrypoint"] }
num-derive = "0.3"
num-traits = "0.2"
arrayref = "0.3.7"
log = "0.4"
solana-logger = "~1.16.13"
spl-memo = "=3.0.1"

[dev-dependencies]
solana-program-test = "~1.16.13"
solana-sdk = "~1.16.13"
tokio = { version = "1.14", features = ["full"] }
anyhow = "1.0"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
no-entrypoint = []
test-bpf = []
test-local = []

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = 3

[profile.test]
opt-level = 2