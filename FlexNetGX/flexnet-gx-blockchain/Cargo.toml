[package]
name = "flexnet-gx-blockchain"
version = "0.1.0"
edition = "2021"

[dependencies]
solana-program = "1.16"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
borsh = "0.9"
blake3 = "1.3"
sha2 = "0.10"
aes-gcm = "0.10"
hex = "0.4"
rand = "0.8"

[lib]
crate-type = ["cdylib", "lib"]

[dev-dependencies]
solana-program-test = "1.16"
solana-sdk = "1.16"